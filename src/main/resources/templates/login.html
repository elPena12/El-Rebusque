<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Iniciar sesión')}"></head>
<body>
<header th:replace="~{fragments :: encabezado}"></header>

<main class="contenedor contenedor--angosto">
    <div class="tarjeta-form">
        <h1 class="titulo-pagina">Iniciar sesión</h1>
        <p class="aviso aviso--info" th:if="${param.pendiente != null}">Inicie sesión para publicar o administrar sus cómics.</p>
        <div th:replace="~{fragments :: avisos}"></div>

        <form th:action="@{/login}" method="post" class="formulario">
            <div class="campo">
                <label for="correo">Correo</label>
                <input type="email" id="correo" name="correo" th:value="${correo}" required autocomplete="email">
            </div>
            <div class="campo">
                <label for="contrasena">Contraseña</label>
                <input type="password" id="contrasena" name="contrasena" required autocomplete="current-password">
            </div>
            <button type="submit" class="boton boton--negro boton--ancho">Entrar</button>
        </form>

        <p class="tarjeta-form__pie">¿No tiene cuenta? <a th:href="@{/registro}">Crear cuenta</a></p>
    </div>
</main>

<footer th:replace="~{fragments :: pie}"></footer>
</body>
</html>
