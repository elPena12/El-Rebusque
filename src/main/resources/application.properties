spring.application.name=el-rebusque

# --- Conexión a PostgreSQL ---
# CREATE DATABASE ElRebusque crea la base en minúscula: elrebusque
spring.datasource.url=jdbc:postgresql://localhost:5432/rebusque
spring.datasource.username=postgres
# Cambie esta clave por la de su PostgreSQL
spring.datasource.password=camilop.

# Las tablas las crea el script SQL; Hibernate no las toca
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# --- Imágenes subidas ---
app.uploads.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

server.port=8080
server.servlet.session.timeout=60m

# Muestra el motivo del error (p. ej. "El cómic no existe") en la página de error
server.error.include-message=always
